services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: employee-rag-pgvector
    environment:
      POSTGRES_DB: employee_rag
      POSTGRES_USER: employee_rag
      POSTGRES_PASSWORD: employee_rag_dev
    ports:
      - "127.0.0.1:6024:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U employee_rag -d employee_rag
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: employee-rag-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
  redis_data:
