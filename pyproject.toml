[project]
name = "employee-rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arvind-mocha", email = "arvindarvind2210@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<47",
    "fastapi[standard]>=0.161.1",
    "langchain-anthropic>=1,<2",
    "langchain-core>=0.3,<2",
    "langchain-huggingface>=1.0,<2",
    "langchain-openai>=1,<2",
    "langchain-postgres>=0.0.17,<0.1",
    "langchain-text-splitters>=0.3,<2",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<8",
    "rq>=2,<3",
    "sentence-transformers>=3,<6",
]

[project.scripts]
employee-rag-system = "app.api.main:main"
employee-rag-ingest = "app.ingestion.ingest:main"
employee-rag-generate-eval = "app.evaluation.jsonl_generator:main"
employee-rag-worker = "app.api.worker:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
